[build]
  command = "npm run build"
  publish = "Frontend/dist"

[build.environment]
  NODE_VERSION = "24"
  VITE_API_URL = "/api"

[[redirects]]
  from = "/api/*"
  to = "https://rutamotor.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200